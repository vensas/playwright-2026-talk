  columns:
  - Session
  - Command
  rows:
  - - Preparation
    - pnpm run test:integration && pnpm run dev
  - - A · Fundamentals
    - pnpm run test:mocked locators · pnpm run test:ui · npx playwright codegen http://localhost:3000
  - - A · Fundamentals
    - npx playwright show-trace test-results/*/trace.zip
  - - B · Mock or real
    - pnpm run test:mocked · pnpm run test:integration · pnpm run test:retries · pnpm run test:report
  - - B · Mock or real
    - npx playwright test --project=integration --workers=4
  - - C · Time control
    - pnpm run test:clock
  - - D · Accessibility
    - pnpm run test:a11y
  - - E · .NET
    - dotnet test (in src/deploy-or-die-dotnet-tests/DeployOrDie.E2E.Tests) — 5 tests, 1 red
  - - F · AI and agents
    - npx playwright mcp · npx playwright init-agents --loop=claude
