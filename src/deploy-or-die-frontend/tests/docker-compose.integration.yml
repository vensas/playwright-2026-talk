services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deployordie_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../deploy-or-die-backend/DeployOrDie.Api
      dockerfile: Dockerfile.test
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=deployordie_test;Username=postgres;Password=postgres"
    ports:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
