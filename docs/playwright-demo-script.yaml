title: Demo Script
subject_name: Playwright Beyond the Happy Path
intro: |
  <p>The stage script for the talk deck <code>playwright-beyond-the-happy-path-dnug-ka-2026-09-24</code> —
  21 slides. The demos run as <strong>6 continuous sessions</strong>. Each session keeps its
  terminal and its browser open, and each numbered step is one slide. The number in brackets
  is the slide number.</p>
  <p>The sessions together need about <strong>48 minutes</strong>. This leaves about
  10 minutes for questions in the 60 minute slot. Do the preparation before the talk starts.
  All paths are relative to <code>src/deploy-or-die-frontend</code>, if no other path is
  given.</p>
  <p>The content pool <code>playwright-content-pool</code> holds all 30 slides. The 9 slides
  that are not in the talk deck have no step here.</p>
sections:
- title: Preparation — 10 min, before the talk
  content: |
    <ol>
      <li>Start the containers one time, so that the image build is not on stage:
          <code>pnpm run test:integration</code>. Keep the report — you need it in session B.</li>
      <li>Make sure that <code>ACCESSIBLE_MODE</code> is <code>false</code> in
          <code>src/a11yMode.ts</code>. The accessibility demo needs this.</li>
      <li>Start the dev server: <code>pnpm run dev</code>. It must stay up for all sessions.</li>
      <li>Install the browser for the C# tests one time:
        <code>pwsh bin/Debug/net10.0/playwright.ps1 install chromium</code> in
        <code>src/deploy-or-die-dotnet-tests/DeployOrDie.E2E.Tests</code>.</li>
      <li>Open three terminals: dev server, test runner, and one spare.</li>
    </ol>
    <p><strong>Watch out:</strong> the container build needs about 4 minutes. Never do it on stage.</p>
- title: Session 0 · Frame — Slides 2–3 · 3 min
  content: |
    <ol>
      <li><strong>[2]</strong> Say who you are in three sentences. The slide holds the rest.</li>
      <li><strong>[3]</strong> Show the app: the name field, the deploy button and the
          result message. Name the two versions in the table — 1.63.0 for TypeScript and
          1.62.0 for .NET.</li>
      <li>Deploy one time and let the audience see the 30 second cooldown.</li>
    </ol>
    <p><strong>Watch out:</strong> the audience must see the cooldown here. Slide 15 shows the
    C# test that moves this cooldown forward with the Clock API.</p>
- title: Session A · Tools and traces — Slides 4–8 · 11 min
  content: |
    <ol>
      <li><strong>[4]</strong> <code>pnpm run test:ui</code> — watch mode, pick a locator with
          the mouse, time travel. Keep this short. It is a quick win, not the subject of the
          talk.</li>
      <li><strong>[5]</strong> Show the two <code>testDir</code> lines. Name the two effects
          from that project: the slow CI job, and the slow start of UI mode.</li>
      <li><strong>[6]</strong> <code>npx playwright show-trace test-results/*/trace.zip</code>
          — step back in time, then change to the ARIA tab. The ARIA tab is new in 1.63.</li>
      <li><strong>[7]</strong> Walk the two workflow steps. The report goes up after each run,
          the trace and the video only after a failure.</li>
      <li><strong>[8]</strong> Tell the story of the team that wrote mostly Playwright tests.
          Close with the line on the slide: an unreliable E2E test is worse than no E2E test.</li>
    </ol>
    <p><strong>Watch out:</strong> close UI mode before session B. It keeps a browser and a port.</p>
- title: Session B · Mock or real backend — Slides 9–13 · 13 min
  content: |
    <ol>
      <li><strong>[9]</strong> <code>pnpm run test:mocked</code> — 17 tests in about 10
          seconds, with no backend. One test is red. Say that this is on purpose, and that
          session C explains it.</li>
      <li><strong>[10]</strong> <code>pnpm run test:integration</code> — the containers are
          warm, then 4 tests run against the real ASP.NET Core API and PostgreSQL.</li>
      <li><strong>[11]</strong> Go through the three questions. Give the answers for the demo
          app: one service, a small contract, thus 17 mocked tests and 4 integration tests.</li>
      <li><strong>[12]</strong> Show the <code>healthcheck</code> and <code>depends_on</code>
          in the Compose file. Name the three things that broke when you started each container
          from the test code.</li>
      <li><strong>[13]</strong> Tell what happened to the team that released an API that was
          not compatible. Then show the three options for the pipeline.</li>
    </ol>
    <p><strong>Watch out:</strong> do not start the containers again here. The build takes about
    4 minutes, and the warm containers from the preparation are enough.</p>
- title: Session C · Accessibility — Slide 14 · 5 min
  content: |
    <ol>
      <li><strong>[14]</strong> <code>pnpm run test:a11y</code> — red. Three rules fail:
          <code>button-name</code>, <code>color-contrast</code> and <code>label</code>.</li>
      <li><code>pnpm run test:report</code> — show the attached <code>axe-results.json</code>.</li>
      <li>Set <code>ACCESSIBLE_MODE = true</code> in <code>src/a11yMode.ts</code>. Run again
          — green. This is the red to green moment of the talk.</li>
      <li>Say the limit out loud: studies find between 25% and 57%. The low number counts the
          WCAG rules that a machine can check, the high number the defects on real pages. The
          sources are in the footnote of the slide.</li>
      <li>Set the value back to <code>false</code>.</li>
    </ol>
    <p><strong>Watch out:</strong> set <code>ACCESSIBLE_MODE</code> back to <code>false</code>
    after the talk, or the demo is gone the next time.</p>
- title: Session D · .NET — Slides 15–17 · 9 min
  content: |
    <ol>
      <li><strong>[15]</strong> The dev server from the preparation must still run on port 3000.
          <code>dotnet test</code> — 5 tests, 1 red. Put <code>DeployTests.cs</code> and
          <code>tests/cooldown.spec.ts</code> side by side. Same locators, same auto-wait, same
          Clock API. Only the names use the .NET style.</li>
      <li><strong>[16]</strong> Walk the two boxes. Say the one sentence that matters: the browser
          API is the same, the test runner is not. Say in one sentence what a test lock and an
          isolated retry are — this deck does not show them, but the box names them. Then run
          <code>npx playwright codegen --target csharp-xunit http://localhost:3000</code>
          and record one click — the recorder writes C#.</li>
      <li><strong>[17]</strong> Show the red <code>AccessibilityTests.cs</code>. Both languages
          report the same three rules: <code>button-name</code>, <code>color-contrast</code> and
          <code>label</code>. Put the C# output next to the TypeScript output from session C.</li>
    </ol>
    <p><strong>Watch out:</strong> <code>global.json</code> selects the Microsoft Testing Platform
    runner. Without it, <code>dotnet test</code> fails on the .NET 10 SDK. The C# tests need their
    own browser: <code>pwsh bin/Debug/net10.0/playwright.ps1 install chromium</code>.</p>
- title: Session E · AI and agents — Slides 18–19 · 5 min
  content: |
    <ol>
      <li><strong>[18]</strong> <code>npx playwright mcp</code> — the server is part of
          Playwright since 1.62.</li>
      <li>Give the agent one task: explore <code>http://localhost:3000</code>. Let it find
          the cooldown with no hint from you.</li>
      <li><strong>[19]</strong> Show the three defects in the wrong example on the slide. Open
          <code>tests/locators.spec.ts</code> next to it. Close with the rule: the agent
          explores, the human reviews.</li>
    </ol>
    <p><strong>Watch out:</strong> this session needs network and a model. Record a fallback
    video before the talk.</p>
- title: Close — Slides 20–21 · 2 min
  content: |
    <ol>
      <li><strong>[20]</strong> Three take-aways: write few E2E tests, run them after a
          backend build too, and make accessibility a gate. Read them, do not explain them
          again — each one has its own slide before.</li>
      <li><strong>[21]</strong> Leave the last slide up for the questions. The QR code goes to
          the repository with the demo project and these slides.</li>
    </ol>
    <p><strong>Watch out:</strong> if you are late, drop slide 17, then slide 6 — keep the TL;DR.
    Do not drop a slide from a real project — they are the reason for this talk.</p>
tables:
