  - - D · .NET
    - dotnet test (in src/deploy-or-die-dotnet-tests/DeployOrDie.E2E.Tests) — 5 tests, 1 red
  - - D · .NET
    - npx playwright codegen --target csharp-xunit http://localhost:3000
  - - E · AI and agents
    - npx playwright mcp
