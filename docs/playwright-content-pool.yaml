- blocks:
  - label: From a real project
    title: Keep the tests in their own folder
    type: heading
  - caption: We made this change in one project. Then we made it again in the other direction.
    code: '// We did this. Playwright then read all of src/ at each start.

      testDir: ''./src'',


      // Keep the default. The tests have their own folder.

      testDir: ''./tests'',

      '
    filename: playwright.config.ts
    language: typescript
    type: code
  - items:
    - label: CI
      text: The test job became slow. Then it stopped with a timeout.
    - label: UI mode
      text: The window needed some minutes to start, but not each time.
    title: What it cost us
    type: box
  - text: Look at testDir in your config. If it points at the source folder, move the tests.
