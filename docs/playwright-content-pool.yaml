  id: traces
  layout: content
  title: Traces
- blocks:
  - label: From a real project
    title: Make the trace available in CI
    type: heading
  - text: A test can fail in CI and pass on your machine. Without the artifacts you can only guess. Thus the pipeline must keep them.
    type: text
  - caption: The report goes up after each run. The trace and the video go up only after a failure.
    code: "- name: Upload the report\n  uses: actions/upload-artifact@v7\n  if: always()\n  with:\n    name: playwright-report\n    path: playwright-report/\n    retention-days: 7\n\n- name: Upload traces and videos\n  uses: actions/upload-artifact@v7\n  if: failure()\n  with:\n    name: playwright-traces\n    path: test-results/\n    retention-days: 7\n"
    filename: .github/workflows/e2e.yml
    language: yaml
    type: code
  - text: Apply to your CICD workflow.
    title: Recommendation
    type: callout
    variant: info
  id: ci-artifacts
  layout: content
- blocks:
  - label: From a real project
    title: Keep the test pyramid
    type: heading
  - text: Codegen, UI mode and the agents make an E2E test look cheap. It is not. An E2E test needs more effort to write and to maintain than a unit test.
    type: text
  - text: The team wrote mostly Playwright tests. React Testing Library was sufficient for 80% of these scenarios. The suite became very large, and then the CI runners became unreliable.
    title: From a team that I mentored
    type: callout
    variant: warning
  - items:
    - label: Many
      text: Unit and component tests. They are fast and cheap.
    - label: Few
      text: E2E tests. Use them for the important paths.
    note: An unreliable E2E test is worse than no E2E test.
    style: connector
    title: What I take from this
    type: box
  - text: Check which E2E tests in your project could be replaced by a unit or a component test.
    title: Recommendation
    type: callout
    variant: info
  id: pyramid
  layout: content
- blocks:
  - caption: You control the answer. Thus you can test the error path, which occurs only 50% of the time.
    code: "// Set the route before you go to the page.\nawait page.route('**/api/deploy', async (route) => {\n  await route.fulfill({\n    status: 200,\n    contentType: 'application/json',\n    body: JSON.stringify({\n      success: false,\n      message: '\U0001F4A5 BOOM! The database just went on vacation.',\n      deployedBy: 'Unlucky Developer',\n    }),\n  });\n});\n\nawait page.goto('/');\n"
    filename: tests/deploy-failure.spec.ts
    language: typescript
    type: code
  - text: "<span style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:15px;white-space:pre;display:block;color:var(--text-primary);\">pnpm run test:mocked</span><span style=\"display:block;margin-top:6px;\">17 tests in about 10 seconds, with no backend and no database.</span>"
    title: Demo
    type: callout
    variant: info
  id: mock
  layout: content
  title: Mock the API
- blocks:
  - caption: The global setup starts the whole environment one time, before the first test.
    code: "const composeEnvironment = await new DockerComposeEnvironment(\n  composeFilePath,\n  'docker-compose.integration.yml',\n).up();\n\nconst backend = composeEnvironment.getContainer('backend-1');\nprocess.env.API_URL = `http://localhost:${backend.getMappedPort(5000)}`;\n"
    filename: tests/testcontainers.ts
    language: typescript
    type: code
  - items:
    - label: Mock
      text: Fast and stable. Blind to the backend.
    - label: Real
      text: Finds integration faults. Slow.
    style: connector
    title: Mock or real
    type: box
  - text: "<span style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:15px;white-space:pre;display:block;color:var(--text-primary);\">pnpm run test:integration</span><span style=\"display:block;margin-top:6px;\">The containers start, then 4 tests run against the real API.</span>"
    title: Demo
    type: callout
    variant: info
  id: real-backend
  layout: content
  title: The real backend
- blocks:
  - label: From a real project
    title: Mock or real — how I choose
    type: heading
  - text: The two approaches are not in competition. Both are correct, and both add value. I choose with the complexity of the project.
    type: text
  - items:
    - label: Services
      text: How many services does the scenario touch?
    - label: Contract
      text: How complex is the API contract?
    - label: Test
      text: How complex is the test itself?
    note: Decide based on your environment and complexity of the project.
    title: Three questions before I decide
    type: box
  - text: The demo app has one service and a small contract. Thus it has 17 mocked tests and 4 integration tests.
    title: Recommendation
    type: callout
    variant: info
  id: mock-or-real-choice
  layout: content
- blocks:
  - label: From a real project
    title: Start the dependencies with Compose
    type: heading
  - text: First I started each container from the test code. It was flaky — on my machine and in CI.
    type: text
  - items:
    - The start order and the readiness check
    - The network between the containers and the port mapping
    - Containers that stayed after the run
    title: What broke
    type: list
  - caption: depends_on with a healthcheck replaces the wait code in the test.
    code: "postgres:\n  healthcheck:\n    test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\nbackend:\n  depends_on:\n    postgres:\n      condition: service_healthy\n"
    filename: tests/docker-compose.integration.yml
    language: yaml
    type: code
  - text: Start the containers one time in a global setup, not for each test.
    title: Recommendation
    type: callout
    variant: info
  id: compose-setup
  layout: content
- id: test-locks
  layout: content
  title: Test locks — new in 1.63
  blocks:
  - type: text
    text: All integration tests write to the same database. Before 1.63 you made the whole file serial, or you accepted the flakiness.
  - type: code
    language: typescript
    filename: tests/deploy-integration.spec.ts
    caption: Two tests with the same lock name never run at the same time — across files and across workers. Playwright Test only — the .NET bindings have no lock, because xUnit is the runner there.
    code: "test.describe('Integration Tests', { lock: 'deploy-db' }, () => {\n  test('should deploy against the real backend', async ({ page }) => {\n    // ...\n  });\n\n  test('the API rejects a request without a name', async ({ request }) => {\n    // ...\n  });\n});\n\n// The other tests keep their parallel speed.\n"
  - type: callout
    variant: info
    title: Demo
    text: "Run the integration project with <code style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:0.95em;color:var(--text-primary);\">--workers=4</code>.<span style=\"display:block;margin-top:6px;\">The Timeline in the report shows that the four locked tests do not overlap.</span>"
- id: speedboard
  layout: content
  title: Speedboard and Timeline
  blocks:
  - type: text
    text: The mocked tests need 10 seconds. The integration tests need more than 4 minutes. The report shows you where the time goes.
  - type: code
    language: bash
    code: 'pnpm run test:report

      '
  - type: box
    title: Two tabs in the HTML report
    items:
    - label: Speedboard
      text: A list of all tests, sorted by duration. The slowest test is at the top.
    - label: Timeline
      text: The wall clock time of the run. It shows where a worker waits.
    note: Most of our 4 minutes is the container build, not the tests.
  - type: callout
    variant: info
    title: Demo
    text: "<span style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:15px;white-space:pre;display:block;color:var(--text-primary);\">pnpm run test:report</span><span style=\"display:block;margin-top:6px;\">After the integration run — look at Speedboard, then at Timeline.</span>"
- id: isolated-retries
  layout: content
  title: Isolated retries — new in 1.62
  blocks:
  - type: code
    language: typescript
    filename: playwright.config.ts
    caption: The retries run one after the other at the end of the run, not immediately under full load. Playwright Test only — not available in the .NET bindings.
    code: "export default defineConfig({\n  retries: process.env.CI ? 2 : 0,\n\n  // New in 1.62.\n  retryStrategy: 'isolated',\n});\n"
  - type: callout
    variant: warning
    title: Why this helps
    text: 'A test that fails only because of parallel load now passes on the isolated retry. This tells you the cause: it is the load, not the code.'
  - type: callout
    variant: info
    title: Demo
    text: "<span style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:15px;white-space:pre;display:block;color:var(--text-primary);\">pnpm run test:retries</span><span style=\"display:block;margin-top:6px;\">The red test retries. With <code style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:0.95em;color:var(--text-primary);\">isolated</code> both retries run last, back to back. Comment the line out and run again: the first retry then runs in the middle of the suite.</span>"
- blocks:
  - label: From a real project
    title: The E2E tests are not only a frontend job
    type: heading
  - text: Playwright tests a user interface. Thus teams put the tests in the frontend pipeline only. But a test against a real backend image also tests the backend.
    type: text
  - text: The team released an API that was not compatible. Nobody ran the E2E tests before the release.
    title: What happened to a team that I mentored
    type: callout
    variant: warning
  - items:
    - Run the tests after each frontend build
    - Run them after each backend build too
    - Or run them nightly — your test plan decides
    title: What I recommend
    type: list
  - text: Find out where your E2E tests run today. Then add the backend build as a trigger, or run them nightly.
    title: Recommendation
    type: callout
    variant: info
  id: when-to-run
  layout: content
- id: clock
  layout: content
  title: The Clock API
  blocks:
  - type: text
    text: The app blocks a second deployment for 30 seconds. A test must not wait 30 seconds.
  - type: code
    language: typescript
    filename: tests/cooldown.spec.ts
    caption: install() must come before every other clock call.
    code: 'await page.clock.install();

      await page.goto(''/'');


      await page.getByRole(''button'', { name: /Deploy Now/i }).click();

      await expect(page.getByRole(''button'', { name: /Next deploy in 30s/i })).toBeVisible();


      // Move the time forward by 5 seconds and let the timers run.

      await page.clock.runFor(5_000);

      await expect(page.getByRole(''button'', { name: /Next deploy in 25s/i })).toBeVisible();


      // Skip the full cooldown. The test needs milliseconds, not 30 seconds.

      await page.clock.fastForward(''00:30'');

      await expect(page.getByRole(''button'', { name: /Deploy Now/i })).toBeEnabled();

      '
  - type: callout
    variant: info
    title: Demo
    text: "<span style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:15px;white-space:pre;display:block;color:var(--text-primary);\">pnpm run test:clock</span><span style=\"display:block;margin-top:6px;\">3 tests in about 2 seconds, for a cooldown of 30 seconds.</span>"
- blocks:
  - caption: The European Accessibility Act applies since June 2025. Thus this check belongs in the pipeline.
    code: "const results = await new AxeBuilder({ page })\n  .withTags(['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa', 'wcag22aa'])\n  .analyze();\n\nawait testInfo.attach('axe-results.json', {\n  body: JSON.stringify(results.violations, null, 2),\n  contentType: 'application/json',\n});\n\nexpect(results.violations.map((v) => ({ rule: v.id, impact: v.impact }))).toEqual([]);\n"
    filename: tests/accessibility.spec.ts
    language: typescript
    type: code
  - text: "Studies find between 25% and 57%*: Depending on what they count - WCAG rules (low) vs. real page defects (high)<span style=\"display:block;margin-top:8px;\"><strong style=\"color:var(--text-accent);\">Recommendation:</strong> test the rest by hand. Do a keyboard walkthrough and a screen reader run for each feature.</span>"
    title: Expectation management
    type: callout
    variant: warning
  - text: "<span style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:15px;white-space:pre;display:block;color:var(--text-primary);\">pnpm run test:a11y</span><span style=\"display:block;margin-top:6px;\">Fails with button-name, color-contrast and label. Set <code style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:0.95em;color:var(--text-primary);\">ACCESSIBLE_MODE = true</code> in <code style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:0.95em;color:var(--text-primary);\">src/a11yMode.ts</code> and it passes.</span>"
    title: Demo
    type: callout
    variant: info
  - text: <span style="font-size:13px;color:var(--text-secondary);">* <a href="https://www.deque.com/blog/automated-testing-study-identifies-57-percent-of-digital-accessibility-issues/" style="color:var(--text-trust);">Deque, 57%</a> · <a href="http://adrianroselli.com/2023/01/comparing-manual-and-free-automated-wcag-reviews.html" style="color:var(--text-trust);">UK Government Digital Service tool audit, 30–40%</a> · <a href="https://karlgroves.com/web-accessibility-testing-what-can-be-tested-and-how/" style="color:var(--text-trust);">Karl Groves, 25–33%</a></span>
    type: text
  id: axe
  layout: content
  title: Accessibility as a gate
- id: aria-snapshots
  layout: content
  title: ARIA snapshots
  blocks:
  - type: code
    language: typescript
    filename: tests/accessibility.spec.ts
    caption: The snapshot asserts the accessibility tree, not the DOM. It shows roles and names, not CSS.
    code: "await expect(page.locator('.card-header')).toMatchAriaSnapshot(`\n  - heading /Deploy or Die/ [level=1]\n  - paragraph: /Every deployment is a gamble/\n`);\n"
  - type: box
    title: Why this is different from axe-core
    items:
    - label: axe-core
      text: Finds known WCAG defects, for example too little contrast
    - label: ARIA snapshot
      text: Finds a change of the structure, for example a lost role or a wrong heading level
    note: The two checks find different faults. Use both.
  - type: callout
    variant: info
    title: Demo
    text: "Change the <code style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:0.95em;color:var(--text-primary);\">h1</code> to an <code style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:0.95em;color:var(--text-primary);\">h2</code>.<span style=\"display:block;margin-top:6px;\">The axe test still passes, but the ARIA snapshot fails.</span>"
- blocks:
  - caption: The API is equal in all languages. Only the names use the .NET style. The package is Microsoft.Playwright.Xunit.v3 — NUnit and MSTest also exist.
    code: "public class DeployTests : PageTest\n{\n    [Fact]\n    public async Task Cooldown_BlocksTheSecondDeployment()\n    {\n        await Page.Clock.InstallAsync();\n        await Page.GotoAsync(\"http://localhost:3000\");\n\n        var deploy = Page.GetByRole(AriaRole.Button,\n            new() { NameRegex = new Regex(\"Deploy Now\") });\n        await deploy.ClickAsync();\n\n        // Move the time forward instead of a wait of 30 seconds.\n        await Page.Clock.FastForwardAsync(\"00:30\");\n        await Expect(deploy).ToBeEnabledAsync();\n    }\n}\n"
    filename: DeployTests.cs
    language: csharp
    type: code
  - text: "<span style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:15px;white-space:pre;display:block;color:var(--text-primary);\">aspire run\ndotnet test</span><span style=\"display:block;margin-top:6px;\">4 tests pass.</span>"
    title: Demo
    type: callout
    variant: info
  id: dotnet
  layout: content
  title: The same test in C#
- blocks:
  - text: The browser API is the same. The test runner is not — in .NET your runner is xUnit, NUnit or MSTest, not Playwright Test.
    type: text
  - columns:
    - - items:
        - label: Locators
          text: GetByRole, GetByLabel, auto-wait
        - label: Clock API
          text: InstallAsync, FastForwardAsync
        - label: ARIA snapshots
          text: ToMatchAriaSnapshotAsync
        - label: Mocking
          text: RouteAsync and the API request context
        - label: Traces
          text: Recorded, then read with show-trace
        - label: Codegen
          text: playwright codegen --target csharp
        title: Works in C#
        type: box
    - - items:
        - label: Test locks
          text: Use an xUnit collection instead
        - label: Isolated retries
          text: The runner controls the retries
        - label: UI mode
          text: No equivalent
        - label: Speedboard
          text: Use your own test report
        - label: Test Agents
          text: They write TypeScript
        title: Playwright Test only
        type: box
    type: columns
  - text: "<span style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:15px;white-space:pre;display:block;color:var(--text-primary);\">npx playwright codegen --target csharp-xunit http://localhost:3000</span><span style=\"display:block;margin-top:6px;\">The recorder writes C#, not TypeScript.</span>"
    title: Demo
    type: callout
    variant: info
  id: dotnet-parity
  layout: content
  title: What the .NET bindings give you
- blocks:
  - caption: Deque.AxeCore.Playwright 4.13.0 adds RunAxe() to Page and Locator. It uses the same axe-core engine as the TypeScript package.
    code: "var results = await Page.RunAxe(new AxeRunOptions\n{\n    RunOnly = new RunOnlyOptions\n    {\n        Type = \"tag\",\n        Values = [\"wcag2a\", \"wcag2aa\", \"wcag21a\", \"wcag21aa\", \"wcag22aa\"],\n    },\n});\n\nAssert.Empty(results.Violations.Select(v => v.Id).ToArray());\n"
    filename: AccessibilityTests.cs
    language: csharp
    type: code
  - text: 'Both languages report the same three rules on our form: button-name, color-contrast and label. Accessibility is not a JavaScript topic.'
    title: Same engine, same result
    type: callout
    variant: trust
  - text: "<span style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:15px;white-space:pre;display:block;color:var(--text-primary);\">aspire run\ndotnet test</span><span style=\"display:block;margin-top:6px;\">5 tests, 1 red. Compare the output with the TypeScript run.</span>"
    title: Demo
    type: callout
    variant: info
  id: dotnet-a11y
  layout: content
  title: Accessibility in C#
- blocks:
  - text: Both give the agent the accessibility tree, not pixels. Thus the agent writes role based locators. The server is part of Playwright since 1.62, the CLI is a separate package.
    type: text
  - columns:
    - - items:
        - label: Tools
          text: A fixed tool schema, always in the context
        - label: Loop
          text: The agent clicks through the page
        - label: Browser
          text: The server starts its own
        title: MCP server
        type: box
    - - items:
        - label: Tokens
          text: Commands only, thus no tool schema
        - label: Attach
          text: A browser that runs, with your session
        - label: Reach
          text: run-code puts a whole snippet in the page
        title: playwright-cli
        type: box
    type: columns
  - text: "<span style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:15px;white-space:pre;display:block;color:var(--text-primary);\">npx playwright mcp --port 7890            # the server, no installation\nnpm install -g @playwright/cli@latest     # the CLI, one installation\nplaywright-cli attach --extension=chrome  # take the browser that is open\nplaywright-cli -s=chrome run-code \"async page => {   # one command, not ten clicks\n  await page.clock.install(); await page.reload();\n  await page.getByRole('button', { name: /Deploy Now/i }).click();\n  await page.clock.fastForward('00:30'); }\"</span><span style=\"font-size:13px;color:var(--text-secondary);display:block;margin-top:8px;\">Both drive the same browser. Only the CLI takes a browser that already runs.</span>"
    title: Demo
    type: callout
    variant: info
  id: mcp
  layout: content
  title: A real browser for an agent — two ways
- id: test-agents
  layout: content
  title: Test Agents
  blocks:
  - type: flow
    label: npx playwright init-agents --loop=claude
    note: Make the agent definitions again after each Playwright update, to get the new tools.
    phases:
    - label: Step 1
      color: trust
      title: Planner
      text: Explores the app and writes a test plan in Markdown to specs/.
    - label: Step 2
      color: accent
      title: Generator
      text: Makes test files from the plan and proves each locator against the running app.
    - label: Step 3
      color: green
      title: Healer
      text: Runs a failed step again, looks for the element that replaced the old one and proposes a patch.
  - type: callout
    variant: info
    title: Demo
    text: "Change the button text from <code style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:0.95em;color:var(--text-primary);\">'Deploy Now'</code> to <code style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:0.95em;color:var(--text-primary);\">'Ship It'</code>.<span style=\"display:block;margin-top:6px;\">Let the healer repair the test.</span>"
- blocks:
  - label: From a real project
    title: Where you must hold the reins
    type: heading
  - text: 'Typical defects: a hard coded wait, a CSS selector instead of a role, and an assertion that is always true.'
    title: A generated test can look correct and be worthless
    type: callout
    variant: warning
  - code: '// Generated — and wrong.

      await page.waitForTimeout(3000);

      await page.click(''.p-button.p-component.deploy-button'');

      await expect(page.locator(''body'')).toBeVisible();

      '
    language: typescript
    type: code
  - items:
    - label: Agent
      text: Explores and writes the first draft.
    - label: Human
      text: Reviews, then puts it in the pipeline.
    style: connector
    title: The rule that works for us
    type: box
  - text: "Use a coding agent for the first draft, not <code style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:0.95em;color:var(--text-primary);\">playwright codegen</code>. The recorder writes CSS selectors and fixed waits. An agent reads the accessibility tree, thus it gives role based locators. Review the result in each case."
    title: Recommendation
    type: callout
    variant: info
  id: caveat
  layout: content
- id: lessons
  layout: content
  title: TL;DR
  blocks:
  - steps:
    - title: Write few E2E tests. The test pyramid still holds.
      text: A suite that became very large made the CI runners unreliable. An unreliable E2E test is worse than no E2E test.
    - title: An E2E test with a real backend is not a frontend job.
      text: A team released an API that was not compatible, because nobody ran the tests. Run them after a backend build too.
    - title: Make accessibility a gate on day one.
      text: The European Accessibility Act applies since June 2025. axe-core is a few lines in the test.
    type: steps
- id: outlook
  layout: content
  title: Not in this talk
  blocks:
  - type: card-grid
    columns: 3
    cards:
    - variant: trust
      tag: '1.61'
      tag_style: opt
      title: WebAuthn passkeys
      text: A virtual authenticator tests a login with a passkey, with no hardware.
    - variant: accent
      tag: '1.62'
      tag_style: opt
      title: Component testing
      text: A new model with stories and galleries mounts one component in a real browser.
    - variant: quality
      tag: '1.48'
      tag_style: opt
      title: WebSocket mocking
      text: routeWebSocket() replaces a realtime backend, for example a live deployment log.
  - type: list
    title: Also worth a look
    items:
    - storageState with IndexedDB — keep a login between tests
    - npx playwright trace — read a trace in the terminal, with no window
    - Copy prompt in the report — give a failed test to an LLM with one click
