  - text: "<span style=\"font-family:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;font-size:15px;white-space:pre;display:block;color:var(--text-primary);\">npx playwright show-trace test-results/.../trace.zip</span>"
    title: Demo
    type: callout
