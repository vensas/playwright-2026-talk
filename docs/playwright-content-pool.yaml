      title: WebAuthn passkeys
      text: A virtual authenticator tests a login with a passkey, with no hardware.
    - variant: accent
      tag: '1.62'
      tag_style: opt
      title: Component testing
      text: A new model with stories and galleries mounts one component in a real browser.
    - variant: quality
      tag: '1.48'
      tag_style: opt
      title: WebSocket mocking
      text: routeWebSocket() replaces a realtime backend, for example a live deployment log.
  - type: list
    title: Also worth a look
    items:
    - storageState with IndexedDB — keep a login between tests
    - npx playwright trace — read a trace in the terminal, with no window
    - Copy prompt in the report — give a failed test to an LLM with one click
